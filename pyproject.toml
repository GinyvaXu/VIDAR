[project]
name = "vidar"
dynamic = ["version"]
description = "VIDAR：把 B 站视频变成可读、可检索、可追溯的 Markdown 知识文档"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GinyvaXu", email = "305326437+GinyvaXu@users.noreply.github.com" }]
keywords = ["bilibili", "whisper", "asr", "transcription", "summarization", "markdown", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "tomli-w>=1.2",
    "platformdirs>=4.3",
    "yt-dlp>=2025.1.26",
    "openai>=1.66",
    "httpx>=0.27",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.2.0",
    # Windows + NVIDIA 显卡：CUDA 12 运行时（CTranslate2 依赖，避免 cublas64_12.dll 缺失）
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.1; sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12>=12.4; sys_platform == 'win32'",
]
gui = ["PySide6>=6.8"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pyinstaller>=6.11",
]

[tool.hatch.version]
path = "VERSION"
pattern = '(?P<version>\d+\.\d+\.\d+)'

[project.urls]
Homepage = "https://github.com/GinyvaXu/VIDAR"
Repository = "https://github.com/GinyvaXu/VIDAR"
Issues = "https://github.com/GinyvaXu/VIDAR/issues"

[project.scripts]
vidar = "vidar.cli:main"
vidar-gui = "vidar.gui.app:main"
# 旧命令名兼容
biliking = "vidar.cli:main"
biliking-gui = "vidar.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/vidar/cli.py" = ["B008"]  # Typer 的 Option/Argument 必须写在函数默认值里

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
